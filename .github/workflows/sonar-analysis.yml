name: Backend Quality

on:
  workflow_dispatch:

jobs:

  # ==========================================================
  # QUALITY
  # ==========================================================

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Show repository structure
      # -------------------------------------------------------
      - name: Check repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 3 -type f | head -100

      # -------------------------------------------------------
      # Setup Python
      # -------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------------
      # Install dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "Installing requirements.txt"
            pip install -r requirements.txt
          fi

          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            echo "Installing Python project"
            pip install .
          fi

          pip install pytest pytest-cov

      # -------------------------------------------------------
      # Tests and coverage - only when tests exist
      # -------------------------------------------------------
      - name: Test with coverage
        run: |
          if [ -d "tests" ] && find tests -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then

            echo "Tests found. Running pytest..."

            if [ -d "app" ]; then
              pytest \
                --cov=app \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing
            else
              pytest \
                --cov=. \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing
            fi

          else
            echo "No Python tests found."
            echo "Skipping pytest and coverage."
          fi

      # -------------------------------------------------------
      # Verify SonarQube is reachable
      # -------------------------------------------------------
      - name: Test SonarQube Connection
        run: |
          echo "Testing SonarQube connectivity..."

          curl -f \
            "${{ vars.SONAR_HOST_URL }}/api/system/status"

      # -------------------------------------------------------
      # SonarQube analysis
      # -------------------------------------------------------
      - name: SonarQube Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=chat-be
            -Dsonar.projectName=chat-be

      # -------------------------------------------------------
      # SonarQube Quality Gate
      # -------------------------------------------------------
      - name: SonarQube Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -------------------------------------------------------
      # Upload coverage only if it exists
      # -------------------------------------------------------
      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14
