name: Backend Quality

on:
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. CHECK REPOSITORY STRUCTURE
      # ======================================================
      - name: Check repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 4 -type f | head -100

      # ======================================================
      # 3. SETUP PYTHON
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 4. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            echo "requirements.txt found."
            pip install -r requirements.txt
          else
            echo "No requirements.txt found."
          fi

          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            echo "Python project configuration found."
            pip install .
          else
            echo "No pyproject.toml or setup.py found."
          fi

          pip install pytest pytest-cov

      # ======================================================
      # 5. TEST + COVERAGE
      # ======================================================
      - name: Test with coverage
        run: |
          echo "Searching for Python tests..."

          TEST_COUNT=$(find . -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            | wc -l)

          echo "Test files found: $TEST_COUNT"

          if [ "$TEST_COUNT" -eq 0 ]; then

            echo "No Python tests found."
            echo "Creating placeholder coverage.xml."

            cat > coverage.xml <<'EOF'
          <?xml version="1.0" ?>
          <coverage version="1.0"
                    timestamp="0"
                    lines-valid="0"
                    lines-covered="0"
                    line-rate="0"
                    branches-valid="0"
                    branches-covered="0"
                    branch-rate="0"
                    complexity="0">
            <sources>
              <source>.</source>
            </sources>
            <packages/>
          </coverage>
          EOF

          else

            echo "Tests found. Running pytest..."

            if [ -d "app" ]; then

              echo "app directory found."

              pytest \
                --cov=app \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing

            else

              echo "app directory not found."
              echo "Running coverage against repository."

              pytest \
                --cov=. \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing

            fi

          fi

          echo "Checking coverage.xml..."

          if [ ! -f "coverage.xml" ]; then
            echo "ERROR: coverage.xml was not generated."
            exit 1
          fi

          ls -lh coverage.xml

      # ======================================================
      # 6. TEST SONARQUBE CONNECTION
      # ======================================================
      - name: Test SonarQube Connection
        run: |
          echo "Testing SonarQube server..."

          echo "SonarQube URL:"
          echo "${{ vars.SONAR_HOST_URL }}"

          curl --fail --show-error \
            "${{ vars.SONAR_HOST_URL }}/api/system/status"

          echo ""
          echo "SonarQube connection successful."

      # ======================================================
      # 7. SONARQUBE ANALYSIS
      # ======================================================
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BE }}
        with:
          args: >
            -Dsonar.projectKey=chat-be
            -Dsonar.projectName=chat-be
            -Dsonar.python.coverage.reportPaths=coverage.xml

      # ======================================================
      # 8. SONARQUBE QUALITY GATE
      # ======================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BE }}

      # ======================================================
      # 9. UPLOAD COVERAGE
      # ======================================================
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error
