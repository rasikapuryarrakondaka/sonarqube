name: Backend Quality

on:
  workflow_dispatch:

jobs:

  # ==========================================================
  # QUALITY
  # ==========================================================

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------------
      # Debug repository structure
      # -------------------------------------------------------
      - name: Check repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          ls -la

          echo "Python project files:"
          find . -maxdepth 4 \
            \( -name "pyproject.toml" \
            -o -name "setup.py" \
            -o -name "requirements.txt" \) \
            -print

      # -------------------------------------------------------
      # Python
      # -------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------------------------------
      # Dependencies
      # -------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          # Install project if it is a Python package
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            pip install .
          fi

          # Install requirements if requirements.txt exists
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          # Testing dependencies
          pip install pytest pytest-cov

      # -------------------------------------------------------
      # Tests + Coverage
      # -------------------------------------------------------
      - name: Test with coverage
        run: |
          if [ -d "app" ]; then
            pytest \
              --cov=app \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
          else
            echo "app directory not found."
            echo "Running pytest without --cov=app."
            pytest \
              --cov=. \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
          fi

      # -------------------------------------------------------
      # Check SonarQube connectivity
      # -------------------------------------------------------
      - name: Test SonarQube Connection
        run: |
          echo "Testing SonarQube server..."
          curl -f "${{ vars.SONAR_HOST_URL }}/api/system/status"

      # -------------------------------------------------------
      # SonarQube Analysis
      # -------------------------------------------------------
      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=chat-be
            -Dsonar.projectName=chat-be
            -Dsonar.python.coverage.reportPaths=coverage.xml

      # -------------------------------------------------------
      # SonarQube Quality Gate
      # -------------------------------------------------------
      - name: SonarQube Quality Gate
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # -------------------------------------------------------
      # Coverage Artifact
      # -------------------------------------------------------
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn
