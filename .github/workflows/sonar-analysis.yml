name: Backend Quality

on:
  workflow_dispatch:

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # 2. CHECK REPOSITORY STRUCTURE
      # ======================================================
      - name: Check repository structure
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 4 -type f | head -100

      # ======================================================
      # 3. SETUP PYTHON
      # ======================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 4. INSTALL DEPENDENCIES
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          if [ -f "pyproject.toml" ] || [ -f "setup.py" ]; then
            pip install .
          fi

          pip install pytest pytest-cov

      # ======================================================
      # 5. RUN TESTS AND GENERATE COVERAGE
      # ======================================================
      - name: Test with coverage
        run: |
          echo "Searching for Python tests..."

          TEST_COUNT=$(find . -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            | wc -l)

          echo "Test files found: $TEST_COUNT"

          if [ "$TEST_COUNT" -eq 0 ]; then
            echo "ERROR: No Python test files found."
            exit 1
          fi

          if [ -d "app" ]; then
            pytest \
              --cov=app \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
          else
            pytest \
              --cov=. \
              --cov-report=xml:coverage.xml \
              --cov-report=term-missing
          fi

          echo "Checking coverage.xml..."
          test -f coverage.xml

      # ======================================================
      # 6. TEST SONARQUBE CONNECTION
      # ======================================================
      - name: Test SonarQube Connection
        run: |
          echo "Testing SonarQube connection..."

          curl --fail \
            "${{ vars.SONAR_HOST_URL }}/api/system/status"

      # ======================================================
      # 7. SONARQUBE ANALYSIS
      # ======================================================
      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BE }}
        with:
          args: >
            -Dsonar.projectKey=chat-be
            -Dsonar.projectName=chat-be
            -Dsonar.python.coverage.reportPaths=coverage.xml

      # ======================================================
      # 8. SONARQUBE QUALITY GATE
      # ======================================================
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BE }}

      # ======================================================
      # 9. UPLOAD COVERAGE
      # ======================================================
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14
